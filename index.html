<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mapa de relaciones</title>
<meta name="description" content="" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234a6b2f'/%3E%3Ccircle cx='10' cy='11' r='3' fill='%23f5f1e2'/%3E%3Ccircle cx='22' cy='12' r='3' fill='%23f5f1e2'/%3E%3Ccircle cx='15' cy='22' r='3' fill='%23f5f1e2'/%3E%3Cpath d='M10 11L22 12L15 22Z' stroke='%23f5f1e2' fill='none'/%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://api.fontshare.com/v2/css?f[]=erode@400,500,600&f[]=zodiak@400,500&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,300..600;1,8..60,300..500&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <svg class="brand-mark" id="cfg-icono" width="34" height="34" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect width="32" height="32" rx="7" fill="var(--color-primary)"/>
          <path d="M10 11L22 12L15 22Z" stroke="var(--color-surface)" stroke-width="1.4" fill="none"/>
          <circle cx="10" cy="11" r="3" fill="var(--color-surface)"/><circle cx="22" cy="12" r="3" fill="var(--color-surface)"/><circle cx="15" cy="22" r="3" fill="var(--color-surface)"/>
        </svg>
        <div class="brand-text">
          <p class="eyebrow" id="cfg-eyebrow"></p>
          <h1 id="cfg-titulo"></h1>
        </div>
      </div>
      <button class="theme-toggle" data-theme-toggle aria-label="Cambiar a modo oscuro" title="Cambiar tema"></button>
    </div>
    <p class="header-lede" id="cfg-intro"></p>
  </header>

  <main class="layout">

    <section class="graph-panel">
      <div class="toolbar">
        <div class="search-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input id="search" type="text" placeholder="Buscar un personaje o un lugar…" autocomplete="off" />
        </div>

        <div class="chip-group" id="group-filters" role="group" aria-label="Filtrar por círculo narrativo">
          <button class="chip active" data-group="all">Todos</button>
        </div>

        <div class="chip-group" id="type-filters" role="group" aria-label="Filtrar por tipo de vínculo">
          <button class="chip active" data-linktype="all">Todos los vínculos</button>
          <button class="chip" data-linktype="explicit">Solo explícitos</button>
          <button class="chip" data-linktype="implicit">Solo implícitos</button>
        </div>

        <button class="reset-btn" id="reset-view">Reiniciar vista</button>
      </div>

      <div class="graph-stage" id="graph-stage">
        <svg id="graph-svg"></svg>

        <div class="legend" id="legend">
          <button class="legend-header" id="legend-toggle" type="button" aria-expanded="true" aria-controls="legend-body">
            <span class="legend-title">Cómo leer el mapa</span>
            <svg class="legend-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="legend-body" id="legend-body"></div>
        </div>

        <div class="hint-pill" id="hint-pill">Arrastra, haz zoom y pulsa sobre un nodo para seguir su hilo narrativo</div>
      </div>

      <div class="chapter-strip" id="chapter-strip" aria-label="Capítulos de la novela, en orden">
      </div>
    </section>

    <aside class="detail-panel" id="detail-panel">
      <div class="detail-empty" id="detail-empty">
        <p class="eyebrow" id="cfg-panel-eyebrow"></p>
        <h2 id="cfg-panel-titulo"></h2>
        <p id="cfg-panel-texto"></p>
        <p class="detail-tip" id="cfg-panel-consejo"></p>
      </div>

      <div class="detail-content" id="detail-content" hidden>
        <button class="close-detail" id="close-detail" aria-label="Cerrar ficha">✕</button>
        <span class="detail-kicker" id="detail-kicker"></span>
        <h2 id="detail-name"></h2>
        <p class="detail-role" id="detail-role"></p>
        <p class="detail-bio" id="detail-bio"></p>

        <h3 class="detail-sub">Conexiones (<span id="detail-count"></span>)</h3>
        <ul class="detail-connections" id="detail-connections"></ul>
      </div>
    </aside>

  </main>

  <footer class="site-footer">
    <p><strong>Fuentes usadas para reconstruir el reparto y sus vínculos:</strong></p>
    <p class="footer-links" id="cfg-fuentes"></p>
    <p class="footer-note" id="cfg-nota-pie">Mapa no oficial, elaborado a partir de reseñas y extractos públicos de la novela con fines de análisis literario.</p>
  </footer>

</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
